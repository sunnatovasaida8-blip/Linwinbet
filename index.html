<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linwinbet - FIFA & Mini Games</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1821;
            --card-bg: #17232d;
            --accent-color: #20d071;
            --accent-hover: #18b560;
            --text-color: #ffffff;
            --text-secondary: #8a9ba8;
            --border-color: #243442;
            --danger-color: #e74c3c;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding-bottom: 75px;
        }

        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 16px; 
            background: var(--card-bg); 
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .user-info { font-size: 14px; font-weight: 600; }
        .balance-box { 
            background: #0a1118; 
            padding: 6px 12px; 
            border-radius: 20px; 
            border: 1px solid var(--border-color);
            font-size: 13px; 
            font-weight: bold; 
            color: #ffd700; 
        }

        .faucet-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 8px;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            white-space: nowrap;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 12px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* Sections */
        .section { display: none; padding: 14px; }
        .section.active { display: block; }

        h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        .refresh-btn {
            background: #243442;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* FIFA Sub-tabs (Live / Liniya) */
        .fifa-subtabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            background: #111c26;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .fifa-subtab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .fifa-subtab-btn.active {
            background: #243442;
            color: var(--accent-color);
        }

        /* Match Card */
        .match-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 1px solid var(--border-color);
        }
        .match-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 10px; align-items: center; }
        .odds { display: flex; gap: 8px; }
        .odd-btn { 
            flex: 1; 
            background: #1e2c38; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            padding: 8px; 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
        }
        .odd-btn span { display: block; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .odd-btn:active { background: var(--accent-color); color: #000; }

        /* Bet Controls Inside Games */
        .bet-control-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: center;
        }
        .bet-input {
            background: #0d1821;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }
        .bet-chip {
            background: #1e2c38;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .bet-chip:active { background: var(--accent-color); color: #000; }

        /* Game Selector Sub-tabs */
        .game-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
        }
        .game-btn {
            background: #1e2c38;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .game-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .game-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* Apple Grid */
        .apple-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
        .apple-cell { background: #1e2c38; aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: 1px solid var(--border-color); }

        /* Mines Grid */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
        .mine-cell { background: #1e2c38; aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: 1px solid var(--border-color); }

        .action-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 11px; text-align: center; cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-item div { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="user-info" id="user-name">Gamer</div>
        <div style="display: flex; align-items: center;">
            <div class="balance-box">🪙 <span id="balance">10000</span></div>
            <button class="faucet-btn" onclick="addFreeCoins()">+1000</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('fifa', event)">🎮 FIFA 26</button>
        <button class="tab-btn" onclick="switchTab('games', event)">🍎 Mini Games</button>
    </div>

    <!-- FIFA Section -->
    <div id="fifa-section" class="section active">
        <!-- Live / Liniya Filter -->
        <div class="fifa-subtabs">
            <button class="fifa-subtab-btn active" onclick="switchFifaMode('live', event)">🔴 LIVE O'yinlar</button>
            <button class="fifa-subtab-btn" onclick="switchFifaMode('line', event)">📅 LINIYA (Kelgusi)</button>
        </div>

        <h3>
            <span id="fifa-title">⚽ FIFA Live O'yinlar</span>
            <button class="refresh-btn" onclick="generateFifaMatches()">🔄 Yangilash</button>
        </h3>

        <div class="bet-control-box">
            <span style="font-size: 12px; color: var(--text-secondary);">Stavka:</span>
            <input type="number" id="sport-bet-amount" class="bet-input" value="500">
            <button class="bet-chip" onclick="setSportBet(100)">100</button>
            <button class="bet-chip" onclick="setSportBet(500)">500</button>
            <button class="bet-chip" onclick="setSportBet(1000)">1000</button>
        </div>

        <div id="fifa-matches-list"></div>
    </div>

    <!-- Mini Games Section -->
    <div id="games-section" class="section">
        <div class="game-selector">
            <button class="game-btn active" onclick="selectMiniGame('apple', event)">🍎 Apple of Fortune</button>
            <button class="game-btn" onclick="selectMiniGame('mines', event)">💣 Mines</button>
            <button class="game-btn" onclick="selectMiniGame('dice', event)">🎲 Dice</button>
        </div>

        <!-- Apple Game -->
        <div id="game-apple" class="game-box">
            <div class="game-container">
                <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Stavka miqdorini tanlang va yaxshi olmalarni toping:</p>
                <div class="bet-control-box">
                    <input type="number" id="apple-bet-amount" class="bet-input" value="200">
                    <button class="bet-chip" onclick="setAppleBet(100)">100</button>
                    <button class="bet-chip" onclick="setAppleBet(500)">500</button>
                    <button class="bet-chip" onclick="setAppleBet(1000)">1000</button>
                </div>
                <div class="apple-grid" id="appleGrid"></div>
                <button class="action-btn" onclick="startAppleGame()">Yangi O'yinni Boshlash</button>
            </div>
        </div>

        <!-- Mines Game -->
        <div id="game-mines" class="game-box" style="display: none;">
            <div class="game-container">
                <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Minalardan qochib, olmoslarni toping 💎</p>
                <div class="bet-control-box">
                    <input type="number" id="mines-bet-amount" class="bet-input" value="200">
                    <button class="bet-chip" onclick="setMinesBet(100)">100</button>
                    <button class="bet-chip" onclick="setMinesBet(500)">500</button>
                    <button class="bet-chip" onclick="setMinesBet(1000)">1000</button>
                </div>
                <div class="mines-grid" id="minesGrid"></div>
                <button class="action-btn" onclick="startMinesGame()">Maydonni Yangilash</button>
            </div>
        </div>

        <!-- Dice Game -->
        <div id="game-dice" class="game-box" style="display: none;">
            <div class="game-container">
                <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Zar 4, 5 yoki 6 tushsa yutasiz!</p>
                <div class="bet-control-box">
                    <input type="number" id="dice-bet-amount" class="bet-input" value="500">
                    <button class="bet-chip" onclick="setDiceBet(100)">100</button>
                    <button class="bet-chip" onclick="setDiceBet(500)">500</button>
                    <button class="bet-chip" onclick="setDiceBet(1000)">1000</button>
                </div>
                <div id="dice-result" style="font-size: 55px; margin: 10px 0;">🎲</div>
                <button class="action-btn" onclick="playDice()">Zar Tashlash</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('fifa', event)">
            <div>🎮</div>FIFA
        </button>
        <button class="nav-item" onclick="switchTab('games', event)">
            <div>🎰</div>Games
        </button>
        <button class="nav-item" onclick="alert('Demo rejimi: Live va Liniya o\'yinlari!')">
            <div>ℹ️</div>Info
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = localStorage.getItem('demo_coins') !== null ? parseInt(localStorage.getItem('demo_coins')) : 10000;
        let currentFifaMode = 'live'; // 'live' yoki 'line'

        function updateBalanceDisplay() {
            document.getElementById('balance').innerText = coins;
            localStorage.setItem('demo_coins', coins);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }
        updateBalanceDisplay();

        function addFreeCoins() {
            coins += 1000;
            updateBalanceDisplay();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function setSportBet(val) { document.getElementById('sport-bet-amount').value = val; }
        function setAppleBet(val) { document.getElementById('apple-bet-amount').value = val; }
        function setMinesBet(val) { document.getElementById('mines-bet-amount').value = val; }
        function setDiceBet(val) { document.getElementById('dice-bet-amount').value = val; }

        /* --- ALL 76 TEAMS (APL, LaLiga, Bundesliga, Ligue 1) --- */
        const allLeagues = [
            {
                name: "APL (Angliya)",
                teams: ["Arsenal", "Man City", "Liverpool", "Chelsea", "Man United", "Tottenham", "Newcastle", "Aston Villa", "Brighton", "West Ham", "Wolverhampton", "Fulham", "Bournemouth", "Everton", "Brentford", "Crystal Palace", "Nottingham Forest", "Leicester", "Ipswich", "Southampton"]
            },
            {
                name: "La Liga (Ispaniya)",
                teams: ["Real Madrid", "Barcelona", "Atletico Madrid", "Athletic Bilbao", "Real Sociedad", "Betis", "Villarreal", "Girona", "Sevilla", "Valencia", "Osasuna", "Getafe", "Celta Vigo", "Rayo Vallecano", "Mallorca", "Alaves", "Las Palmas", "Espanyol", "Leganes", "Valladolid"]
            },
            {
                name: "Bundesliga (Germaniya)",
                teams: ["Bayern Munich", "Bayer Leverkusen", "Dortmund", "RB Leipzig", "Eintracht Frankfurt", "Wolfsburg", "Gladbach", "Freiburg", "Hoffenheim", "Augsburg", "Werder Bremen", "Union Berlin", "Mainz", "Heidenheim", "Stuttgart", "Bochum", "St. Pauli", "Holstein Kiel"]
            },
            {
                name: "Ligue 1 (Fransiya)",
                teams: ["PSG", "Monaco", "Marseille", "Lille", "Lyon", "Lens", "Rennes", "Nice", "Reims", "Strasbourg", "Toulouse", "Montpellier", "Nantes", "Brest", "Auxerre", "Angers", "Le Havre", "Saint-Etienne"]
            }
        ];

        function switchFifaMode(mode, event) {
            currentFifaMode = mode;
            document.querySelectorAll('.fifa-subtab-btn').forEach(b => b.classList.remove('active'));
            if (event) event.currentTarget.classList.add('active');

            document.getElementById('fifa-title').innerText = mode === 'live' ? '⚽ FIFA Live O\'yinlar' : '📅 FIFA Liniya (Kelgusi O\'yinlar)';
            generateFifaMatches();
        }

        function generateFifaMatches() {
            const container = document.getElementById('fifa-matches-list');
            container.innerHTML = '';

            const timeOptions = ["Bugun, 21:45", "Bugun, 23:00", "Ertaga, 18:30", "Ertaga, 20:00", "18-Oktabr, 19:15", "19-Oktabr, 22:00"];

            allLeagues.forEach(league => {
                let shuffledTeams = [...league.teams].sort(() => 0.5 - Math.random());
                
                // Jamoalar sonining yarmi har bir rejimga taqsimlanadi
                let pairsCount = Math.floor(shuffledTeams.length / 4); 

                for (let i = 0; i < pairsCount * 2; i += 2) {
                    let team1 = shuffledTeams[i];
                    let team2 = shuffledTeams[i + 1];

                    let odd1 = (Math.random() * 2 + 1.25).toFixed(2);
                    let oddX = (Math.random() * 1.5 + 3.10).toFixed(2);
                    let odd2 = (Math.random() * 2.5 + 1.40).toFixed(2);

                    let statusText = "";
                    if (currentFifaMode === 'live') {
                        let minute = Math.floor(Math.random() * 85) + 1;
                        let score1 = Math.floor(Math.random() * 3);
                        let score2 = Math.floor(Math.random() * 3);
                        statusText = `<span style="color: var(--danger-color); font-weight: bold;">● ${minute}' min (${score1} : ${score2})</span>`;
                    } else {
                        let startTime = timeOptions[Math.floor(Math.random() * timeOptions.length)];
                        statusText = `<span style="color: var(--accent-color); font-weight: bold;">⏰ ${startTime}</span>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-meta">
                            <span>FIFA 26 | ${league.name}</span>
                            ${statusText}
                        </div>
                        <div class="teams">
                            <span>${team1}</span>
                            <span>VS</span>
                            <span>${team2}</span>
                        </div>
                        <div class="odds">
                            <button class="odd-btn" onclick="placeSportBet('${team1}', ${odd1})">1 <span>${odd1}</span></button>
                            <button class="odd-btn" onclick="placeSportBet('Durang', ${oddX})">X <span>${oddX}</span></button>
                            <button class="odd-btn" onclick="placeSportBet('${team2}', ${odd2})">2 <span>${odd2}</span></button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
            tg.HapticFeedback.impactOccurred('light');
        }

        function placeSportBet(team, odd) {
            let bet = parseInt(document.getElementById('sport-bet-amount').value) || 100;
            if (coins < bet) { alert('COIN yetarli emas!'); return; }
            coins -= bet;
            updateBalanceDisplay();
            tg.HapticFeedback.impactOccurred('medium');
            alert(`${bet} COIN tikildi: ${team} (Kef: ${odd})`);
        }

        /* --- TABS SWITCHER --- */
        function switchTab(tabName, event) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'fifa') {
                document.getElementById('fifa-section').classList.add('active');
                generateFifaMatches();
            } else {
                document.getElementById('games-section').classList.add('active');
                startAppleGame();
            }
            if (event) event.currentTarget.classList.add('active');
        }

        function selectMiniGame(game, event) {
            document.querySelectorAll('.game-box').forEach(gb => gb.style.display = 'none');
            document.querySelectorAll('.game-btn').forEach(gb => gb.classList.remove('active'));

            document.getElementById('game-' + game).style.display = 'block';
            event.currentTarget.classList.add('active');

            if (game === 'apple') startAppleGame();
            if (game === 'mines') startMinesGame();
        }

        /* --- MINI GAMES LOGIC --- */
        function startAppleGame() {
            let bet = parseInt(document.getElementById('apple-bet-amount').value) || 200;
            const grid = document.getElementById('appleGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const cell = document.createElement('div');
                cell.className = 'apple-cell';
                cell.innerHTML = '❓';
                cell.onclick = function() {
                    if (cell.dataset.opened) return;
                    if (coins < bet) { alert('Balansingizda yetarli COIN yoʻq!'); return; }
                    coins -= bet;
                    cell.dataset.opened = "true";

                    if (Math.random() > 0.4) {
                        cell.innerHTML = '🍏'; cell.style.background = '#1b4d3e';
                        coins += Math.floor(bet * 1.8);
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        cell.innerHTML = '🍎'; cell.style.background = '#4d1b1b';
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                    updateBalanceDisplay();
                };
                grid.appendChild(cell);
            }
        }

        function startMinesGame() {
            let bet = parseInt(document.getElementById('mines-bet-amount').value) || 200;
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerHTML = '❓';
                cell.onclick = function() {
                    if (cell.dataset.opened) return;
                    if (coins < bet) { alert('Balansingizda yetarli COIN yoʻq!'); return; }
                    coins -= bet;
                    cell.dataset.opened = "true";

                    if (Math.random() > 0.35) {
                        cell.innerHTML = '💎'; cell.style.background = '#1b4d3e';
                        coins += Math.floor(bet * 1.9);
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        cell.innerHTML = '💣'; cell.style.background = '#4d1b1b';
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                    updateBalanceDisplay();
                };
                grid.appendChild(cell);
            }
        }

        function playDice() {
            let bet = parseInt(document.getElementById('dice-bet-amount').value) || 500;
            if (coins < bet) { alert('Balansingizda yetarli COIN yoʻq!'); return; }
            coins -= bet;

            const res = Math.floor(Math.random() * 6) + 1;
            const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            document.getElementById('dice-result').innerText = diceIcons[res - 1];

            if (res >= 4) {
                coins += bet * 2;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                tg.HapticFeedback.notificationOccurred('error');
            }
            updateBalanceDisplay();
        }

        generateFifaMatches();
    </script>
</body>
</html>
