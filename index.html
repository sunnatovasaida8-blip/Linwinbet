<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports & Apple Game Demo TWA</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1923;
            --card-bg: #192734;
            --accent-color: #20d071;
            --accent-hover: #17b35f;
            --text-color: #ffffff;
            --text-secondary: #8a9ba8;
            --border-color: #283848;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding-bottom: 70px;
        }

        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 16px; 
            background: var(--card-bg); 
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .user-info { font-size: 14px; font-weight: 600; }
        .balance-box { 
            background: #111b24; 
            padding: 6px 12px; 
            border-radius: 20px; 
            border: 1px solid var(--border-color);
            font-size: 13px; 
            font-weight: bold; 
            color: #ffd700; 
        }

        /* Top-up Demo Coin Button */
        .faucet-btn {
            background: #283848;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 6px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 8px 16px;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* Content Sections */
        .section { display: none; padding: 16px; }
        .section.active { display: block; }

        h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        /* Match Card */
        .match-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid var(--border-color);
        }
        .match-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 12px; align-items: center; }
        .odds { display: flex; gap: 8px; }
        .odd-btn { 
            flex: 1; 
            background: #22303f; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            padding: 10px 6px; 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
        }
        .odd-btn span { display: block; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .odd-btn:active { background: var(--accent-color); color: #000; }

        /* Mini Game (Apple) */
        .game-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .apple-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        .apple-cell {
            background: #22303f;
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .action-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 11px; text-align: center; cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-item div { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="user-info" id="user-name">Gamer</div>
        <div style="display: flex; align-items: center;">
            <div class="balance-box">🪙 <span id="balance">1000</span> COIN</div>
            <button class="faucet-btn" onclick="addFreeCoins()">+500</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('sport', event)">⚽ Sport Simulatsiyasi</button>
        <button class="tab-btn" onclick="switchTab('games', event)">🍏 Apple Mini Game</button>
    </div>

    <!-- Sport Section -->
    <div id="sport-section" class="section active">
        <h3>🔥 Virtual Jonli O'yinlar (Demo)</h3>

        <div class="match-card">
            <div class="match-meta">
                <span>Angliya Premyer Ligasi</span>
                <span style="color: #ff4d4d; font-weight: bold;">● 74'</span>
            </div>
            <div class="teams">
                <span>Arsenal</span>
                <span>2 : 1</span>
                <span>Real Madrid</span>
            </div>
            <div class="odds">
                <button class="odd-btn" onclick="placeDemoBet('Arsenal', 1.45)">1 <span>1.45</span></button>
                <button class="odd-btn" onclick="placeDemoBet('Durang', 4.20)">X <span>4.20</span></button>
                <button class="odd-btn" onclick="placeDemoBet('Real Madrid', 7.50)">2 <span>7.50</span></button>
            </div>
        </div>

        <div class="match-card">
            <div class="match-meta">
                <span>Ispaniya La Ligasi</span>
                <span style="color: #ff4d4d; font-weight: bold;">● 32'</span>
            </div>
            <div class="teams">
                <span>Barselona</span>
                <span>0 : 0</span>
                <span>Atletiko</span>
            </div>
            <div class="odds">
                <button class="odd-btn" onclick="placeDemoBet('Barselona', 2.10)">1 <span>2.10</span></button>
                <button class="odd-btn" onclick="placeDemoBet('Durang', 3.30)">X <span>3.30</span></button>
                <button class="odd-btn" onclick="placeDemoBet('Atletiko', 3.60)">2 <span>3.60</span></button>
            </div>
        </div>
    </div>

    <!-- Mini Games Section -->
    <div id="games-section" class="section">
        <h3>🍏 Apple of Fortune (Demo O'yin)</h3>
        <div class="game-container">
            <p style="font-size: 13px; color: var(--text-secondary);">
                Har bir katakcha bosish = <b>50 COIN</b>. Yaxshi olma topsangiz <b>+100 COIN</b>!
            </p>
            <div class="apple-grid" id="appleGrid"></div>
            <button class="action-btn" onclick="resetAppleGame()">O'yinni qayta boshlash</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('sport', event)">
            <div>⚽</div>Sport
        </button>
        <button class="nav-item" onclick="switchTab('games', event)">
            <div>🎮</div>O'yinlar
        </button>
        <button class="nav-item" onclick="alert('Demo rejimi: Barcha tangalar virtual!')">
            <div>ℹ️</div>Ma'lumot
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Virtual Balansni boshqarish (LocalStorage)
        let coins = parseInt(localStorage.getItem('demo_coins')) || 1000;

        function updateBalanceDisplay() {
            document.getElementById('balance').innerText = coins;
            localStorage.setItem('demo_coins', coins);
        }

        // Boshlang'ich Sozlamalar
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }
        updateBalanceDisplay();

        // Tekin Coin qo'shish
        function addFreeCoins() {
            coins += 500;
            updateBalanceDisplay();
            tg.HapticFeedback.notificationOccurred('success');
            alert('Sizga 500 tekin COIN berildi!');
        }

        // Tablarni almashtirish
        function switchTab(tabName, event) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));

            if (tabName === 'sport') {
                document.getElementById('sport-section').classList.add('active');
            } else {
                document.getElementById('games-section').classList.add('active');
                initAppleGame();
            }
            if (event) event.currentTarget.classList.add('active');
        }

        // Demo Sport Stavkasi (100 Coin)
        function placeDemoBet(team, odd) {
            const betAmount = 100;
            if (coins < betAmount) {
                alert('Tangalaringiz yetarli emas! +500 tugmasini bosing.');
                return;
            }

            coins -= betAmount;
            updateBalanceDisplay();
            tg.HapticFeedback.impactOccurred('medium');

            alert(`100 COIN tikildi: ${team} (Kef: ${odd})\nNatija o'yin yakunida aniqlanadi!`);
        }

        // Apple of Fortune Mini Game Mantiqi
        function initAppleGame() {
            const grid = document.getElementById('appleGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const cell = document.createElement('div');
                cell.className = 'apple-cell';
                cell.innerHTML = '❓';
                
                cell.onclick = function() {
                    if (cell.dataset.opened) return;

                    if (coins < 50) {
                        alert('Katakni ochish uchun 50 COIN kerak!');
                        return;
                    }

                    coins -= 50; // Katak ochish narxi
                    cell.dataset.opened = "true";

                    const isGoodApple = Math.random() > 0.4;
                    if (isGoodApple) {
                        cell.innerHTML = '🍏';
                        cell.style.background = '#1b4d3e';
                        coins += 100; // Yutuq
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        cell.innerHTML = '🍎';
                        cell.style.background = '#4d1b1b';
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                    updateBalanceDisplay();
                };
                grid.appendChild(cell);
            }
        }

        function resetAppleGame() {
            initAppleGame();
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
